<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Табло · Softball Baku</title>
<meta name="theme-color" content="#0B1626">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Табло">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-192.png?v=2">
<link rel="icon" href="../favicon.ico">
<!-- Табло (24.11.2026): только счёт двух команд (±) и номер иннинга (±) — крупно, кнопками.
     Ничего никуда не отправляет: работает полностью офлайн (sw.js), счёт хранится только на этом устройстве (localStorage). -->
<style>
:root{--bg:#0B1626;--pan:#13233A;--pan2:#1B2F4C;--line:#29405F;--tx:#F3F6FB;--mut:#8EA3C0;--a:#D85A30;--b:#1f6fc0;--ok:#1E9E5A;--red:#E5484D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:600 16px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{min-height:100%;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));gap:10px;max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px}
.brand{font-weight:900;letter-spacing:1.5px;font-size:14px;display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.brand b{color:var(--a)}
.brand{white-space:nowrap;overflow:hidden}
@media (max-width:480px){.brand .full{display:none}}

.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--pan);border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.on{color:#ffb4b4;border-color:var(--red)}.pill.on i{background:var(--red);animation:bl 1.2s infinite}
.pill.wait i{background:#E0A030}
@keyframes bl{50%{opacity:.25}}
.ic{width:38px;height:38px;border-radius:12px;background:var(--pan);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
/* табло */
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.tm{background:var(--pan);border-radius:24px;border:2px solid var(--line);padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;position:relative;overflow:hidden}
.tm::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.tm .nm{font-size:clamp(18px,4.4vw,30px);font-weight:800;text-align:center;line-height:1.1;padding:6px 8px}
.tm .sc{font-size:clamp(110px,30vw,240px);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-3px}
.tm .adj{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;width:100%}
.tm .adj button{height:clamp(64px,11vh,96px);border-radius:18px;background:var(--pan2);font-size:36px;font-weight:800}
.tm .adj .plus{background:var(--c)}
.inn{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:stretch}
.inn>div{background:var(--pan);border:1px solid var(--line);border-radius:20px;text-align:center;padding:8px}
.inn small{display:block;font-size:12px;letter-spacing:2px;color:var(--mut)}
.inn b{font-size:clamp(40px,10vw,64px);font-weight:900;font-variant-numeric:tabular-nums}
.inn button{border-radius:20px;background:var(--pan2);font-size:36px;font-weight:800;min-height:clamp(64px,11vh,96px)}
/* окно */
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:10px}
.md>div{background:var(--pan);border:1px solid var(--line);border-radius:22px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.md h3{margin:0 0 10px;font-size:19px}
.md p{color:var(--mut);font-weight:500;line-height:1.4;margin:6px 0 12px}
.md label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.md input,.md select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.md .row{display:flex;gap:8px;margin-top:14px}.md .row button{flex:1;padding:13px;border-radius:14px;background:var(--pan2)}
.md .pri{background:var(--a)!important}.md .dng{background:#7A1F1F!important}
.md .err{color:#ffb4b4}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.sw button,.sw .cst{width:46px;height:46px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw button.on{border-color:#fff}
.sw .cst{display:grid;place-items:center;background:var(--pan2);font-size:20px;position:relative;margin:0;cursor:pointer}
.sw .cst input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.tm .nm .ed{font-size:.6em;opacity:.55;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;font-size:14px;z-index:10;pointer-events:none}
@media (orientation:landscape) and (max-height:560px){ #app{gap:8px} .tm{padding:10px 10px 8px;gap:4px} .tm .nm{font-size:20px;padding:2px} .tm .sc{font-size:clamp(70px,24vh,180px)} .tm .adj button,.inn button{height:52px;min-height:52px;font-size:30px} .inn>div{padding:2px 8px;display:flex;align-items:center;justify-content:center;gap:12px} .inn b{font-size:34px;line-height:1} }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const K='sbBoard.v1', TEAMS=[{name:'Bina Warriors',color:'#D85A30'},{name:'Gilavar Baku',color:'#1f6fc0'}];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fresh=()=>({id:today(),A:{...TEAMS[0]},B:{...TEAMS[1]},inning:1,line:{A:[],B:[]},started:Date.now()});
let G=load(), H=[];                  // H — история для «Отменить» (только в этой сессии)
function load(){ try{ const g=JSON.parse(localStorage.getItem(K)); if(g&&g.A) return g; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(K,JSON.stringify(G)); }catch(e){} draw(); }
function snap(){ H.push(JSON.stringify(G)); if(H.length>200) H.shift(); }
const total=t=>(G.line[t]||[]).reduce((a,b)=>a+(+b||0),0);
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1600); }
function vib(ms){ try{ navigator.vibrate&&navigator.vibrate(ms||15); }catch(e){} }

/* ---------- действия: счёт ± и иннинг ± ---------- */
const A={
  run(t){ snap(); const i=G.inning-1, a=G.line[t]; while(a.length<=i) a.push(0); a[i]++; vib(); save(); },   // ран пишется в текущий иннинг (для онлайн-счёта на сайте)
  unrun(t){ if(!total(t)) return; snap(); const a=G.line[t]; for(let i=a.length-1;i>=0;i--) if(a[i]>0){ a[i]--; break; } vib(); save(); },
  inn(d){ const n=G.inning+d; if(n<1) return; snap(); G.inning=n; vib(); save(); },
  undo(){ if(!H.length){ toast('Нечего отменять'); return; } G=JSON.parse(H.pop()); save(); toast('Отменено'); },
  newGame(){ modal(`<h3>Новая игра</h3><p>Счёт обнулится, иннинг станет 1.</p>
    <div class="row"><button onclick="closeM()">Отмена</button><button class="dng" onclick="A.newOk()">Обнулить</button></div>`); },
  newOk(){ const a={...G.A}, b={...G.B}; snap(); G=fresh(); G.A=a; G.B=b; closeM(); save(); toast('Новая игра'); },
  team(t){ const x=G[t], C=['#D85A30','#1f6fc0','#1E9E5A','#C0392B','#7D3C98','#F1C40F','#16A085','#E84393','#2C3E50','#ECF0F1'];
    modal(`<h3>Команда</h3><label>Название</label><input id="m-nm" value="${esc(x.name)}" maxlength="30">
    <label>Цвет</label><div class="sw">${C.map(c=>`<button style="background:${c}" class="${c.toLowerCase()===String(x.color).toLowerCase()?'on':''}" onclick="A.pick(this,'${c}')"></button>`).join('')}
      <label class="cst" title="свой цвет">🎨<input type="color" id="m-cc" value="${esc(x.color)}" oninput="A.pick(null,this.value)"></label></div>
    <input type="hidden" id="m-cl" value="${esc(x.color)}">
    <div class="row"><button onclick="closeM()">Отмена</button><button class="pri" onclick="A.teamOk('${t}')">Сохранить</button></div>`); },
  pick(el,c){ $('#m-cl').value=c; document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b===el)); },
  teamOk(t){ snap(); G[t].name=($('#m-nm').value||'').trim()||G[t].name; G[t].color=$('#m-cl').value; closeM(); save(); }
};

/* ---------- вид ---------- */
const light=c=>{ const m=/^#?([0-9a-f]{6})$/i.exec(c||''); if(!m) return false; const n=parseInt(m[1],16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))>170; };
function team(t){ const x=G[t];
  return `<div class="tm" style="--c:${esc(x.color)}"><div class="nm" onclick="A.team('${t}')">${esc(x.name)} <span class="ed">✎</span></div><div class="sc">${total(t)}</div>
    <div class="adj"><button onclick="A.unrun('${t}')" aria-label="минус">−</button><button class="plus" style="${light(x.color)?'color:#0B1626':''}" onclick="A.run('${t}')" aria-label="плюс">+</button></div></div>`; }
function draw(){
  $('#app').innerHTML=`<div class="top"><div class="brand">⚾ <span class="full">SOFTBALL <b>BAKU</b> ·&nbsp;</span>ТАБЛО</div><button class="ic" onclick="A.undo()" title="Отменить последнее">↶</button><button class="ic" onclick="menu()" title="Меню">☰</button></div>
   <div class="board">${team('A')}${team('B')}</div>
   <div class="inn"><button onclick="A.inn(-1)" aria-label="предыдущий иннинг">−</button><div><small>ИННИНГ</small><b>${G.inning}</b></div><button onclick="A.inn(1)" aria-label="следующий иннинг">+</button></div>`;
}
function modal(h){ closeM(); const d=document.createElement('div'); d.className='md'; d.onclick=e=>{ if(e.target===d) closeM(); }; d.innerHTML=`<div>${h}</div>`; document.body.appendChild(d); }
function closeM(){ document.querySelectorAll('.md').forEach(e=>e.remove()); }
function menu(){ modal(`<h3>Меню</h3>
  <div class="row"><button class="dng" onclick="closeM();A.newGame()">Новая игра (обнулить)</button></div>
  <div class="row"><button onclick="location.href='../'">На сайт</button><button onclick="closeM()">Закрыть</button></div>
  <p>Нажмите на название команды (✎), чтобы изменить его или цвет. ↶ — отменить последнее нажатие.</p>`); }

/* ---------- экран не гаснет ---------- */
let lock=null; async function wake(){ try{ if('wakeLock' in navigator&&document.visibilityState==='visible') lock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });

/* новый день — новая игра (если старая закончена или пустая) */
if(G.id!==today()&&total('A')+total('B')===0){ const a=G.A,b=G.B; G=fresh(); G.A=a; G.B=b; }
draw(); wake();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e=>console.warn('[board] sw',e));
</script>
</body>
</html>
