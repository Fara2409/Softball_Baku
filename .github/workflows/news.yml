name: Baseball news
# Каждые 2 часа обновляет data/news.json (MLB.com + ESPN MLB) для блока «Новости бейсбола» на главной.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/news.yml", "tools/fetch_news.py"]
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_news.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/news.json && git ls-files --error-unmatch data/news.json >/dev/null 2>&1; then
            echo "no changes"; exit 0
          fi
          git config user.name "softball-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Новости бейсбола: обновление"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
